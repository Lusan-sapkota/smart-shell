[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-shell-cli"
version = "1.2.0"
authors = [
  { name="Lusan Sapkota", email="sapkotalusan@gmail.com" },
]
description = "Natural language to Bash/Zsh commands with a local AI (Ollama, LM Studio) or any OpenAI-compatible API, with safety checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich",
    "click",
    "requests",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/Lusan-sapkota/smart-shell"
Issues = "https://github.com/Lusan-sapkota/smart-shell/issues"

[project.scripts]
smart-shell = "smart_shell.main:main"

[tool.setuptools.packages.find]
include = ["smart_shell", "smart_shell.*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
